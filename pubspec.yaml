name: klik_mobile
description: Aplikasi olahraga KLIK dengan mode uji coba lokal.
publish_to: none
version: 0.4.3+7
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.3.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6
  flutter_svg: ^2.4.0
  qr_flutter: ^4.1.0
  geolocator: ^14.1.2
  geocoding: ^5.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/demo/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
